<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contato - Tempero de Ouro</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body> 

        <header>
            <div>
                <a href="../home.html" class="logo">Tempero<span> de Ouro</span></a>
            </div>
            <nav>
                <a href="../home.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
                <a href="cardapio.html">Cardápio</a>
            </nav>
        </header>

        <main class="contato">

            <section class="formulario">
                <h1>CONTATO</h1>
                <p class="descricao">
                    Caso haja alguma dúvida ou reclamação,
                    entre em contato conosco que resolveremos
                    para você.
                </p>
                <form>

                    <div class="campos">
                        <div class="campo">
                            <label for="nome">NOME</label>
                            <input type="text" id="nome"placeholder="Digite seu nome" required>
                        </div>

                        <div class="campo">
                            <label for="email">E-MAIL</label>
                            <input type="email" id="email"placeholder="Digite seu e-mail" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="assunto">ÁREA</label>

                        <select id="assunto" required>
                            <option value="">Selecione</option>
                            <option value="duvida">Dúvidas</option>
                            <option value="reclamacao">Reclamações</option>
                            <option value="sugestao">Sugestões</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="mensagem">MENSAGEM</label>
                        <textarea id="mensagem"placeholder="Digite sua mensagem..."required></textarea>
                    </div>

                    <button type="submit">
                        ENVIAR ❯
                    </button>

                    </form>

            </section>

        </main>

        <footer>
            <p>&copy; 2026 Tempero de Ouro. Todos os direitos reservados.</p>
            <a href="contato.html">Entre em contato</a>
        </footer>

    </body>
</html>
