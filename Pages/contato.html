<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Tempero de Ouro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body> 

    <header>
        <div>
            <a href="../home.html">Tempero<span> de Ouro</span></a>
        </div>
        <nav>
            <a href="../home.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
            <a href="cardapio.html">Cardápio</a>
        </nav>
    </header>

    <main>
        <section id="secaoContato">
            <h1>Fale com o Restaurante Tempero de Ouro</h1>
            <p>Dúvidas, sugestões ou mau atendimento? Fale conosco.</p>
            
            <form id="containerFormContato">
                <label for="nomeContato">Nome completo</label>
                <input id="nomeContato" type="text" required>
                <br>

                <label for="emailContato">E-mail</label>
                <input id="emailContato" type="email" required>
                <br>

                <label for="mensagemContato">Mensagem</label>
                <textarea id="mensagemContato" rows="5" minlength="40" required></textarea>
                <br>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>   
        <p>&copy; 2026 Tempero de Ouro. Todos os direitos reservados.</p>
        <p><a href="contato.html">Entre em contato</a></p>
    </footer>

</body>
</html>
